<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="米数计算">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<title>米数计算器</title>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--label:#000;--secondary:#8e8e93;
  --sep:rgba(60,60,67,.18);--blue:#007aff;--fill:rgba(118,118,128,.12);--red:#ff3b30;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--card:#1c1c1e;--label:#fff;--secondary:#8e8e93;
  --sep:rgba(84,84,88,.6);--blue:#0a84ff;--fill:rgba(118,118,128,.36);--red:#ff453a}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label)}
body{
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) 0 calc(env(safe-area-inset-bottom,0px) + 32px);
}
main{max-width:520px;margin:0 auto;padding:0 16px}
h1{font-size:34px;line-height:1.2;font-weight:700;letter-spacing:.3px;margin:20px 4px 16px}

.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{
  flex:1;border:0;background:transparent;color:var(--label);
  font:inherit;font-size:14px;font-weight:500;padding:7px 10px;border-radius:7px;
  transition:background .2s,box-shadow .2s;
}
.seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
@media (prefers-color-scheme:dark){.seg button.on{background:#636366}}
#seg{margin-bottom:20px}
.seg.small{flex:0 0 auto;min-width:150px}

.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;min-height:48px;padding:0 16px;position:relative}
.row:not(.hidden)~.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row label,.row .lab{flex:0 0 auto;margin-right:12px}
.row .unit{color:var(--secondary);margin-left:6px;flex:0 0 auto}
.row input{
  flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--blue);
  font:inherit;font-size:17px;text-align:right;padding:12px 0;
  -webkit-appearance:none;appearance:none;border-radius:0;
}
.row input::placeholder{color:var(--secondary);opacity:.6}
.hidden{display:none!important}
.footer{font-size:13px;color:var(--secondary);margin:8px 16px 0}
.sec{margin-top:24px}
.opt{margin-top:16px}

.result{padding:16px;text-align:center}
.result .cap{font-size:13px;color:var(--secondary)}
.result .num{font-size:44px;font-weight:700;letter-spacing:-.5px;line-height:1.15;margin-top:2px;word-break:break-all;font-variant-numeric:tabular-nums}
.result .num small{font-size:20px;font-weight:600;margin-left:4px;color:var(--secondary)}
.result .sub{font-size:15px;color:var(--secondary);margin-top:4px;min-height:20px}
.result .err{color:var(--red)}
.roll{margin:14px -16px 0;padding:14px 16px 0;border-top:.5px solid var(--sep)}
.roll .big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.roll .big small{font-size:17px;font-weight:600;margin-left:3px;color:var(--secondary)}

.btn{
  display:block;width:100%;margin-top:16px;border:0;border-radius:14px;
  background:var(--blue);color:#fff;font:inherit;font-weight:600;padding:15px;
  transition:opacity .15s,transform .15s;
}
.btn:active{opacity:.7;transform:scale(.99)}
.btn:disabled{background:var(--fill);color:var(--secondary)}

.hhead{display:flex;justify-content:space-between;align-items:baseline;margin:28px 16px 8px}
.hhead h2{margin:0;font-size:13px;font-weight:400;color:var(--secondary)}
.hhead button{border:0;background:none;color:var(--red);font:inherit;font-size:15px;padding:4px 0}
.hhead button:disabled{color:var(--secondary);opacity:.5}
.item{display:flex;align-items:stretch;position:relative}
.item+.item::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.item .main{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  border:0;background:transparent;color:inherit;font:inherit;text-align:left;padding:11px 4px 11px 16px}
.item .main:active{background:var(--fill)}
.item .l{min-width:0}
.item .name{font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t{font-size:13px;color:var(--secondary)}
.item .f{font-size:15px;margin-top:1px;color:var(--label)}
.item .x{font-size:13px;color:var(--secondary);margin-top:1px}
.item .r{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .del{flex:0 0 48px;border:0;background:transparent;color:var(--red);display:flex;align-items:center;justify-content:center}
.item .del:active{background:var(--fill)}
.item .del svg{width:20px;height:20px}
.empty{padding:22px 16px;text-align:center;color:var(--secondary);font-size:15px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translate(-50%,20px);
  background:rgba(60,60,67,.92);color:#fff;font-size:14px;padding:10px 18px;border-radius:20px;
  opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;
  padding:0 10px calc(env(safe-area-inset-bottom,0px) + 10px);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:520px;transform:translateY(30px);transition:transform .25s}
.sheet-bg.show .sheet{transform:none}
.sheet .box{background:var(--card);border-radius:14px;overflow:hidden;text-align:center}
.sheet .msg{padding:14px;font-size:13px;color:var(--secondary)}
.sheet button{display:block;width:100%;border:0;background:transparent;font:inherit;font-size:20px;padding:16px;
  border-top:.5px solid var(--sep)}
.sheet .danger{color:var(--red)}
.sheet .cancel{margin-top:8px;border-radius:14px;background:var(--card);color:var(--blue);font-weight:600;border-top:0}
</style>
</head>
<body>
<main>
  <h1>米数计算</h1>

  <div class="seg" id="seg">
    <button data-mode="m" class="on">求米数</button>
    <button data-mode="q">求印刷数量</button>
  </div>

  <div class="group">
    <div class="row" id="rowName"><label for="pname">项目名称</label><input id="pname" type="text" maxlength="40" placeholder="选填" autocomplete="off" enterkeyhint="done"></div>
    <div class="row"><label for="teeth">齿数</label><input id="teeth" type="text" inputmode="decimal" placeholder="0" autocomplete="off"><span class="unit">齿</span></div>
    <div class="row"><label for="panels">拼板数</label><input id="panels" type="text" inputmode="decimal" placeholder="0" autocomplete="off"><span class="unit">拼</span></div>
    <div class="row" id="rowQty"><label for="qty">印刷数量</label><input id="qty" type="text" inputmode="decimal" placeholder="0" autocomplete="off"><span class="unit">个</span></div>
    <div class="row hidden" id="rowMeters"><label for="meters">米数</label><input id="meters" type="text" inputmode="decimal" placeholder="0" autocomplete="off"><span class="unit">米</span></div>
  </div>
  <div class="footer" id="formula">米数 = 0.003175 × 齿数 × 印刷数量 ÷ 拼板数</div>

  <div id="mOnly">
    <div class="group opt">
      <div class="row"><label for="extra">额外印刷米数</label><input id="extra" type="text" inputmode="decimal" placeholder="选填" autocomplete="off"><span class="unit">米</span></div>
      <div class="row"><span class="lab">原料卷长</span><span style="flex:1"></span>
        <div class="seg small" id="rollSeg"><button data-len="1000" class="on">1000 米</button><button data-len="1500">1500 米</button></div></div>
    </div>
    <div class="footer">用米数加上额外米数，算出需要几卷原料。</div>
  </div>

  <div class="group sec result">
    <div class="cap" id="cap">米数</div>
    <div class="num" id="num">—</div>
    <div class="sub" id="sub"></div>
    <div class="roll hidden" id="roll">
      <div class="cap">需要原料</div>
      <div class="big" id="rollBig"></div>
      <div class="sub" id="rollSub"></div>
    </div>
  </div>
  <button class="btn" id="save" disabled>计算并记录</button>

  <div class="hhead"><h2 id="hcount">最近记录</h2><button id="clear" disabled>清除历史</button></div>
  <div class="group" id="history"></div>
  <div class="footer">点按一条记录，可将数值带回输入框；点右侧垃圾桶可单独删除。最多保留 20 条。</div>
</main>

<div class="toast" id="toast"></div>
<div class="sheet-bg" id="sheetBg">
  <div class="sheet">
    <div class="box">
      <div class="msg" id="sheetMsg"></div>
      <button class="danger" id="confirmBtn"></button>
    </div>
    <button class="cancel" id="cancelBtn">取消</button>
  </div>
</div>

<script>
(function(){
  var K = 0.003175, MAX = 20, KEY = "meter-calc-history-v1";
  var $ = function(id){return document.getElementById(id)};
  var mode = "m", rollLen = 1000, last = null, mem = [], pending = null;

  function load(){
    try{ var s = localStorage.getItem(KEY); if(s) return JSON.parse(s) || []; }catch(e){}
    return mem.slice();
  }
  function store(list){
    mem = list.slice();
    try{ localStorage.setItem(KEY, JSON.stringify(list)); }catch(e){}
  }

  function num(v){
    var n = parseFloat(String(v).replace(/,/g,"").trim());
    return isFinite(n) ? n : NaN;
  }
  function fmt(n, d){ return n.toLocaleString("zh-CN",{maximumFractionDigits:d==null?2:d}); }
  function pad(n){return n<10?"0"+n:""+n}
  function stamp(ts){
    var d = new Date(ts);
    return (d.getMonth()+1)+"月"+d.getDate()+"日 "+pad(d.getHours())+":"+pad(d.getMinutes());
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  var tt;
  function toast(msg){
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(tt); tt = setTimeout(function(){t.classList.remove("show")},1600);
  }

  /* ---------- 计算 ---------- */
  function calc(){
    var t = num($("teeth").value), p = num($("panels").value);
    var a = mode==="m" ? num($("qty").value) : num($("meters").value);
    var exRaw = $("extra").value.trim();
    var anyInput = $("teeth").value || $("panels").value || (mode==="m"?$("qty").value:$("meters").value);
    var numEl = $("num"), sub = $("sub"), roll = $("roll");
    last = null; $("save").disabled = true; roll.classList.add("hidden");
    sub.classList.remove("err");

    if(!anyInput){ numEl.textContent = "—"; sub.textContent = ""; return; }
    if(isNaN(t)||isNaN(p)||isNaN(a)){ numEl.textContent = "—"; sub.textContent = "请填写全部三项"; return; }
    if(t<=0||p<=0||a<=0){ numEl.textContent = "—"; sub.textContent = "数值需大于 0"; sub.classList.add("err"); return; }

    var r;
    if(mode==="m"){
      var ex = 0;
      if(exRaw){
        ex = num(exRaw);
        if(isNaN(ex)||ex<0){ numEl.textContent = "—"; sub.textContent = "额外米数需为不小于 0 的数字"; sub.classList.add("err"); return; }
      }
      r = K*t*a/p;
      numEl.innerHTML = fmt(r,2)+"<small>米</small>";
      sub.textContent = "";
      var total = r + ex;
      var rolls = Math.max(1, Math.ceil(total/rollLen - 1e-9));
      var left = rolls*rollLen - total; if(left < 0.0005) left = 0;
      $("rollBig").innerHTML = rolls+"<small>卷</small>";
      $("rollSub").textContent = "总用量 "+fmt(total,2)+" 米 · 最后一卷约剩 "+fmt(left,1)+" 米";
      roll.classList.remove("hidden");
      last = {mode:"m",t:t,p:p,a:a,r:r,ex:ex,len:rollLen,total:total,rolls:rolls,left:left,name:$("pname").value.trim()};
    }else{
      r = a*p/(K*t);
      numEl.innerHTML = fmt(r,2)+"<small>个</small>";
      sub.textContent = "向上取整 "+fmt(Math.ceil(r-1e-9),0)+" · 四舍五入 "+fmt(Math.round(r),0);
      last = {mode:"q",t:t,p:p,a:a,r:r};
    }
    $("save").disabled = false;
  }

  function setRoll(len){
    rollLen = len;
    var b = $("rollSeg").children;
    for(var i=0;i<b.length;i++) b[i].classList.toggle("on", +b[i].dataset.len===len);
  }

  function setMode(m){
    mode = m;
    var btns = $("seg").children;
    for(var i=0;i<btns.length;i++) btns[i].classList.toggle("on", btns[i].dataset.mode===m);
    $("rowQty").classList.toggle("hidden", m!=="m");
    $("rowMeters").classList.toggle("hidden", m!=="q");
    $("mOnly").classList.toggle("hidden", m!=="m");
    $("rowName").classList.toggle("hidden", m!=="m");
    $("cap").textContent = m==="m" ? "米数" : "印刷数量";
    $("formula").textContent = m==="m"
      ? "米数 = 0.003175 × 齿数 × 印刷数量 ÷ 拼板数"
      : "印刷数量 = 米数 × 拼板数 ÷ (0.003175 × 齿数)";
    calc();
  }

  /* ---------- 历史 ---------- */
  var TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
  function render(){
    var list = load(), box = $("history");
    $("clear").disabled = !list.length;
    $("hcount").textContent = list.length ? "最近记录（"+list.length+"/"+MAX+"）" : "最近记录";
    if(!list.length){ box.innerHTML = '<div class="empty">暂无记录</div>'; return; }
    box.innerHTML = list.map(function(h,i){
      var f = h.mode==="m"
        ? fmt(h.t,3)+" 齿 · "+fmt(h.a,3)+" 个 · "+fmt(h.p,3)+" 拼"
        : fmt(h.t,3)+" 齿 · "+fmt(h.a,3)+" 米 · "+fmt(h.p,3)+" 拼";
      var r = h.mode==="m" ? fmt(h.r,2)+" 米" : fmt(h.r,2)+" 个";
      var name = h.name ? '<div class="name">'+esc(h.name)+'</div>' : "";
      var x = "";
      if(h.mode==="m" && h.rolls){
        x = '<div class="x">'+(h.ex>0?"额外 "+fmt(h.ex,2)+" 米 · ":"")+"需 "+h.rolls+" 卷（"+h.len+" 米/卷）· 余约 "+fmt(h.left,1)+" 米</div>";
      }
      return '<div class="item"><button class="main" data-i="'+i+'"><div class="l">'+name+
        '<div class="t">'+(h.mode==="m"?"求米数":"求印刷数量")+" · "+stamp(h.ts)+'</div><div class="f">'+esc(f)+'</div>'+x+
        '</div><div class="r">'+esc(r)+'</div></button>'+
        '<button class="del" data-ts="'+h.ts+'" aria-label="删除这条记录">'+TRASH+'</button></div>';
    }).join("");
  }

  function save(){
    if(!last) return;
    var list = load(), e = {ts:Date.now()};
    for(var k in last) e[k] = last[k];
    if(!e.name) delete e.name;
    list.unshift(e);
    store(list.slice(0,MAX));
    render(); toast("已记录");
  }

  /* ---------- 确认面板 ---------- */
  function ask(msg, label, fn){
    pending = fn; $("sheetMsg").textContent = msg; $("confirmBtn").textContent = label;
    $("sheetBg").classList.add("show");
  }
  function closeSheet(){ pending = null; $("sheetBg").classList.remove("show"); }

  /* ---------- 事件 ---------- */
  $("seg").addEventListener("click",function(e){ var b = e.target.closest("button"); if(b) setMode(b.dataset.mode); });
  $("rollSeg").addEventListener("click",function(e){ var b = e.target.closest("button"); if(b){ setRoll(+b.dataset.len); calc(); } });
  ["teeth","qty","meters","panels","extra","pname"].forEach(function(id){
    $(id).addEventListener("input",calc);
    $(id).addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); this.blur(); save(); } });
  });
  $("save").addEventListener("click",function(){ document.activeElement.blur(); save(); });

  $("history").addEventListener("click",function(e){
    var d = e.target.closest(".del");
    if(d){
      var ts = +d.dataset.ts;
      ask("确定删除这条记录吗？此操作无法撤销。","删除记录",function(){
        store(load().filter(function(h){return h.ts!==ts}));
        render(); toast("已删除");
      });
      return;
    }
    var b = e.target.closest(".main"); if(!b) return;
    var h = load()[+b.dataset.i]; if(!h) return;
    setMode(h.mode);
    $("teeth").value = h.t; $("panels").value = h.p;
    (h.mode==="m"?$("qty"):$("meters")).value = h.a;
    if(h.mode==="m"){
      $("extra").value = h.ex>0 ? h.ex : "";
      $("pname").value = h.name || "";
      setRoll(h.len===1500?1500:1000);
    }
    calc(); window.scrollTo({top:0,behavior:"smooth"});
  });

  $("clear").addEventListener("click",function(){
    ask("确定清除全部计算历史吗？此操作无法撤销。","清除历史",function(){ store([]); render(); toast("历史已清除"); });
  });
  $("cancelBtn").addEventListener("click",closeSheet);
  $("sheetBg").addEventListener("click",function(e){ if(e.target===this) closeSheet(); });
  $("confirmBtn").addEventListener("click",function(){ var f = pending; closeSheet(); if(f) f(); });

  render(); setMode("m");
})();
</script>
</body>
</html>
